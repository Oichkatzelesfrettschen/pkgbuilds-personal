# /etc/modprobe.d/tty-only-nvidia.conf - keep NVIDIA as the only DRM provider
#
# WHY:  This box has a single dGPU and no iGPU. Any other graphics kernel
#       driver auto-binding (e.g. radeon on a leftover IGD enable, nouveau
#       on a degraded probe, the in-tree nova_* skeleton) would race for
#       primary DRM master and break Wayland session handoff.
# WHAT: Blacklists every non-NVIDIA DRM/graphics module the kernel ships.
# HOW:  modprobe refuses these autoloads; explicit `modprobe -f` still works
#       for diagnostic use.
#
# Re-asserted by /etc/modprobe.d/nouveau-blacklist.conf for nouveau
# specifically (with modeset=0 on top of the blacklist), to defend against
# someone removing this file later.

blacklist amdgpu
blacklist radeon
blacklist i915
blacklist nouveau
blacklist nova_core
blacklist nova_drm
