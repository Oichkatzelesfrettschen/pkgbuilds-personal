# /etc/modprobe.d/nvidia-uvm-sam.conf - UVM migration of system memory
#
# nvidia_uvm documents this parameter as "Disable migration of system
# allocated memory for CDMM/HMM", default true ("modinfo -p nvidia_uvm").
# Setting it to 0 permits UVM to migrate system-allocated memory to the GPU.
# The package adopted this line from an unowned hand edit whose purpose was
# never recorded; keep it only while a CUDA workload depends on HMM
# migration, and delete this file to return to the driver default.
options nvidia_uvm uvm_disable_sam_migration=0
