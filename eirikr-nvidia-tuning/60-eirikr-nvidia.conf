# /usr/lib/environment.d/60-eirikr-nvidia.conf - NVIDIA session environment
#
# systemd-environment-d-generator reads this when the user manager starts, so
# every unit of the user manager, plasmashell and the apps it launches
# included, inherits it independent of the display manager or login shell.
#
# __GL_YIELD=USLEEP
#   The NVIDIA GL/EGL driver yields with usleep(0) instead of the default
#   sched_yield() while it waits for the GPU (driver README, "Controlling the
#   yield behavior"). sched_yield() returns at once when no other task is
#   runnable, so a waiting thread keeps its core; usleep(0) releases it. The
#   CPU or latency effect on this machine is unmeasured.
#
# __GL_SYNC_TO_VBLANK is never set here. With it set to 1, a Qt Quick window
# on the NVIDIA EGL Wayland path stops its main thread at the first hide and
# re-show (a 100 ms heartbeat window emitted 30 of 200 beats in 20 s); with it
# unset the same window ran clean (196 beats). The render thread waits in
# eglSwapBuffers (libnvidia-egl-wayland2, wl_display_dispatch_queue) for a
# frame callback while the main thread waits on the render thread. This
# package sets the variable nowhere; any other source that exports it, a
# profile script or a per-app wrapper, still reaches its children, and driver
# application profiles rank below environment variables (README appendix
# J6), so they cannot undo it.
__GL_YIELD=USLEEP

# libva loads libva-nvidia-driver (NVDEC) for Firefox, mpv and OBS.
LIBVA_DRIVER_NAME=nvidia
