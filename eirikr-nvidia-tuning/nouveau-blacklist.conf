# /etc/modprobe.d/nouveau-blacklist.conf - belt-and-braces nouveau lockout
#
# WHY:  Even if tty-only-nvidia.conf is removed/edited, this file ensures
#       nouveau cannot bind to the GPU at all and does not attempt KMS
#       (which would put a dummy framebuffer in front of nvidia-drm and
#       break early KMS handoff to the proprietary stack).
# WHAT: blacklist nouveau (no auto-load) + modeset=0 (refuse KMS even on
#       force-load).
# HOW:  modprobe consults this on every module load attempt.

blacklist nouveau
options nouveau modeset=0
