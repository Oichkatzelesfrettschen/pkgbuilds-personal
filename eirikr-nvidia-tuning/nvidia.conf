# /etc/modprobe.d/nvidia.conf - NVIDIA module options for the desktop
#
# This file shares its name with /usr/lib/modprobe.d/nvidia.conf from
# cachyos-settings and therefore replaces it entirely, so every option that
# file sets must be restated here. Verify each option against
# "modinfo -p nvidia" before adding it: modprobe discards an unknown
# parameter with one log line. The open module exposes no
# NVreg_UsePageAttributeTable.
#
#   NVreg_InitializeSystemMemoryAllocations=0
#       Skip zeroing system memory before the GPU maps it (driver default 1).
#       Restates the cachyos-settings value. Trade-off: a GPU allocation can
#       expose stale contents of freed system pages.
#   NVreg_PreserveVideoMemoryAllocations=1
#       Save VRAM contents across suspend so the compositor's buffers
#       survive resume; nvidia-suspend/-resume/-hibernate.service require it
#       (README chapter 20). The open module saves to tmpfs by default
#       (NVreg_TemporaryFilePath unset), which must hold the used VRAM.
#   NVreg_RegistryDwords=RMUseSwI2c=0x01;RMI2cSpeed=100
#       Software I2C at 100 kHz for DDC/CI, the configuration ddcutil
#       documents for NVIDIA monitor control.
#
# NVreg_DynamicPowerManagement and NVreg_EnableS0ixPowerManagement keep
# their driver defaults (0x03 and 0): README chapter 21 states 0x03
# disables runtime D3 on every desktop GPU, and S0ix applies to notebooks.

options nvidia \
    NVreg_InitializeSystemMemoryAllocations=0 \
    NVreg_PreserveVideoMemoryAllocations=1 \
    NVreg_RegistryDwords=RMUseSwI2c=0x01;RMI2cSpeed=100
