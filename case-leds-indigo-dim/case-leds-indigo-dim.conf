# Configuration for case-leds-indigo-dim, sourced as a POSIX sh fragment.

# RRGGBB hex without a leading '#'.
# Indigo (#4B0082) scaled to 10 percent brightness.
led_color=08000D

# OpenRGB mode for the motherboard controller. "static" is stored in the
# ASUS Aura controller hardware and survives reboots on its own.
motherboard_mode=static

# OpenRGB mode for DRAM and GPU devices. Corsair DRAM exposes only
# "direct"; Gigabyte GPUs accept "direct" as well.
default_mode=direct

# Glob patterns matched against the device names that
# "openrgb --list-devices" prints. OpenRGB 1.0 reports no device type,
# so these patterns are the only classification available, and a device
# matching none of them keeps its own lighting. Widen a pattern after
# checking the exact name that --list-devices reports.
motherboard_match='*TUF GAMING B550*'
dram_match='*Vengeance*'
gpu_match='*GeForce*'

# Device detection polling: at most detect_retries listings, separated by
# detect_interval seconds, waiting for the motherboard controller. Each
# listing costs about 4.5 seconds, so this budget must stay well under
# TimeoutStartSec in the unit file.
detect_retries=3
detect_interval=2
