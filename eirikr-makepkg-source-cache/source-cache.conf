#!/hint/bash
# shellcheck disable=2034

# makepkg clones a VCS source() into the build directory under the name the
# source declares, so a -git package leaves a working clone beside its PKGBUILD
# and the PKGBUILD repository reports it untracked after every build. Five such
# directories were named one at a time in that repository's .gitignore before
# this file existed.
#
# SRCDEST moves every downloaded and cloned source out of the build directory
# into one shared cache, so a clone lands there instead and a second build of
# the same package updates it rather than cloning again.
#
# /var/cache/makepkg survives a reboot. The disk-backed /tmp on this machine is
# wiped at boot and /var/tmp binds from it, so a source cache under either would
# re-download everything on the next boot.
SRCDEST=/var/cache/makepkg/sources
