#  wifi.powersave = 2 disables the power-save mode NetworkManager enables by
#  default, which parks the radio between frames and adds wake latency to the
#  first packet of a burst. MAC randomization during scans is off because this
#  machine takes a DHCP reservation and a changing scan address makes the lease
#  and the LAN inventory disagree about which host is which.
[connection]
wifi.powersave = 2

[device]
wifi.scan-rand-mac-address = no
