#  The mt7921e driver exposes a p2p-dev-wlan0 companion device for Wi-Fi
#  Direct. NetworkManager manages it as an ordinary device, which leaves a
#  permanently unavailable connection in its device list and in every status
#  readout. Nothing on this machine uses Wi-Fi Direct.
[keyfile]
unmanaged-devices=interface-name:p2p-dev-wlan0
