#  Socket and queue sizing for the wired link, plus the congestion control and
#  connection tracking this machine's roles need. Applied after
#  /usr/lib/sysctl.d/50-default.conf by lexical order.

#  Socket buffers. The stock rmem_max of about 7 MiB bounds a single TCP
#  connection's window, which the distcc mesh and the Sunshine stream both
#  reach on a 2.5GbE link.
net.core.rmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_max = 16777216
net.core.wmem_default = 1048576
net.ipv4.tcp_rmem = 4096 1048576 16777216
net.ipv4.tcp_wmem = 4096 1048576 16777216
net.ipv4.udp_rmem_min = 8192
net.ipv4.udp_wmem_min = 8192

#  Softirq budget, so a burst arriving faster than the stack drains it queues
#  rather than drops.
net.core.netdev_max_backlog = 10000
net.core.netdev_budget = 600
net.core.netdev_budget_usecs = 4000

#  BBR paces against measured bottleneck bandwidth and round-trip time rather
#  than treating loss as congestion, which is what a LAN build mesh and a video
#  stream both want. It needs the tcp_bbr module, loaded by
#  /etc/modules-load.d/tcp-bbr.conf, or this line fails and cubic stays.
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_sack = 1
net.core.default_qdisc = fq_codel

#  Connection tracking. 262144 is also the kernel's computed default at this
#  machine's memory size, so the line pins the value rather than raising it,
#  and keeps it pinned if the machine's memory changes.
net.netfilter.nf_conntrack_max = 262144

net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 8192
fs.file-max = 2097152
