#  sysctl runs before nf_conntrack would autoload on its first packet, and
#  net.netfilter.nf_conntrack_max in 99-network-performance.conf does not exist
#  until the module is present, so the write fails silently and the value stays
#  at whatever the module computes when it eventually loads. Loading it here
#  makes the sysctl take. Same mechanism as tcp-bbr.conf.
nf_conntrack
