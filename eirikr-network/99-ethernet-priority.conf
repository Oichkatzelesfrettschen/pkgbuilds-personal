#  Prefer a wired link over wlan0 whenever both carry a carrier. NetworkManager
#  compares route metrics, and its wifi default sits near 600, so an ethernet
#  metric of 100 wins without disabling wifi.
#
#  The two settings were in separate [connection-ethernet] sections in the file
#  this replaces. GKeyFile, which NetworkManager parses with, takes one group
#  per name, so the second section's autoconnect-priority discarded the route
#  metrics above it. They are one section here.
[connection-ethernet]
match-device=type:ethernet
ipv4.route-metric=100
ipv6.route-metric=100
connection.autoconnect-priority=100
