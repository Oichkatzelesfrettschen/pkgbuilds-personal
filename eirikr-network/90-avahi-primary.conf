#  avahi-daemon is enabled on this machine and owns mDNS. systemd-resolved
#  answering the same multicast groups makes avahi log "Detected another IPv4
#  mDNS stack running" and puts two responders on the wire for one hostname.
#
#  The earlier eirikr-network-fixes resolved the same conflict the other way,
#  enabling LLMNR and MulticastDNS in resolved so it could own mDNS instead.
#  That direction contradicts the running system: "resolvectl status" reads
#  "-LLMNR -mDNS" on every link, avahi-daemon is enabled, and the LAN
#  inventory resolves .local names through avahi. Installing the opposite
#  would have broken name resolution, so this package carries the direction
#  the machine actually runs.
[Resolve]
LLMNR=no
MulticastDNS=no
