# /tmp is volatile across boots. /var/tmp survives reboot and ages entries
# after two days, which stays below the measured fill interval of the backing
# filesystem. Both paths remain root-owned sticky directories.
D! /tmp 1777 root root -
e  /tmp 1777 root root 2d
q  /var/tmp 1777 root root 2d

# The first-boot archive preserves content from the former shared-root layout.
# It is root-only and retained until an administrator removes it after review.
x /srv/fasttmp/legacy-shared-root
