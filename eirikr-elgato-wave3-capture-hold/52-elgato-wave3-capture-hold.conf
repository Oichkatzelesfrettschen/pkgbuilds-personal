# Elgato Wave:3 (USB 0fd9:0070, full-speed UAC1) capture hold.
#
# The Wave:3 firmware streams microphone samples on capture endpoint 0x82
# only while two orderings hold. Capture opens before playback: with
# playback already streaming, a capture at the playback rate returns
# bit-exact zero samples and a capture at another rate has its UAC1 SET_CUR
# sampling-frequency request stalled ("cannot set freq N to ep 0x82" from
# snd-usb-audio). Playback joins at the capture rate: a playback opened at
# another rate while capture streams stops endpoint 0x82, and ALSA's capture
# hw_ptr stops advancing while the PCM still reports RUNNING. Raw hw:N,0
# reproduces the first ordering; under PipeWire a 32 kHz client moves the
# sink to 96 kHz (an integer multiple) and reproduces the second.
#
# The capture node therefore streams from the moment WirePlumber creates it
# and never suspends, so it is open before any playback stream, and both
# nodes are fixed at 48 kHz, so clients at other rates are resampled rather
# than reopening either PCM at a second rate. The playback node suspends
# when idle as usual. The device must be idle when WirePlumber starts.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input\\.usb-Elgato_Systems_Elgato_Wave_3_.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
        node.always-process = true
        audio.rate = 48000
        audio.allowed-rates = [ 48000 ]
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output\\.usb-Elgato_Systems_Elgato_Wave_3_.*" }
    ]
    actions = {
      update-props = {
        audio.rate = 48000
        audio.allowed-rates = [ 48000 ]
      }
    }
  }
]
