# ramoops divides its reserved region into zones, and console_size defaults to
# 0, so a stock ramoops captures only kmsg dumps: oops and panic. This machine
# resets itself with no oops and no panic, and keeps nowatchdog, so no kmsg
# dump is ever produced and the dump zones stay empty. The console zone is a
# registered console writing printk into persistent RAM continuously, so it
# holds the last lines the kernel emitted before a silent reset. It is the only
# zone that records this machine's failure.
#
# kdumpst-load.sh loads the module as
#   modprobe ramoops mem_name=<reserve_mem name> record_size=$PSTORE_RECORD_SZ
# and modprobe merges these options before its own arguments, so mem_name and
# record_size stay kdumpst's and console_size and ecc come from here.
#
# 2 MiB of the 16 MiB region reserved by reserve_mem on the kernel command
# line; the remaining 14 MiB holds 56 dump zones of 256 KiB. ecc adds a
# Reed-Solomon header per zone, which reports corruption in a buffer that
# survived a reset rather than presenting corrupt text as a log.
options ramoops console_size=2097152 ecc=1
