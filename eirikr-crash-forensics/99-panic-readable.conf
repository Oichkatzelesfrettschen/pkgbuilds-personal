# kdumpst ships kernel.panic=-1 in /usr/lib/sysctl.d/20-panic-sysctls.conf,
# which reboots the instant a panic happens and leaves nothing on screen and
# nothing flushed to the journal. This machine resets itself during graphical
# startup with no recorded cause, so the panic text is the evidence. 10
# seconds is long enough to read or photograph before the reboot proceeds.
# Applied after 20-panic-sysctls.conf by lexical order, so this value wins.
kernel.panic = 10

# cachyos-settings disables the hard-lockup detector a second time, by sysctl,
# in /usr/lib/sysctl.d/70-cachyos-settings.conf: "kernel.nmi_watchdog = 0".
# Removing nowatchdog from the kernel command line does not survive that, and
# the failure is silent -- the detector reads as configured and never fires.
# This file sorts after 70-, so these win.
#
# The cost is one PMU counter per CPU, which the perf-based detector holds for
# as long as it is armed. Zen3 has six general-purpose counters per core, and
# the setting is runtime-writable, so a profiling session that wants the
# counter back takes it with "sysctl kernel.nmi_watchdog=0" and no reboot.
kernel.watchdog = 1
kernel.nmi_watchdog = 1

# Deliberately left at the kernel default rather than raised to match
# hardlockup_panic. A soft lockup is a task holding a CPU with interrupts
# still enabled, which is frequently survivable; the detector's backtrace is
# the evidence wanted, and panicking on it would convert a recoverable stall
# into a reboot. kdumpst sets kernel.hardlockup_panic = 1 in
# /usr/lib/sysctl.d/20-panic-sysctls.conf, and that one is wanted: a CPU
# spinning with interrupts disabled is not coming back.
kernel.softlockup_panic = 0
