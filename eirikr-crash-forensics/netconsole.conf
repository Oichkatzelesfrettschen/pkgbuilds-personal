# Target for netconsole-hangcapture.service.
#
# netconsole sends every printk as a UDP datagram, so the receiving host holds
# the kernel log of a hang that never reaches this machine's own disk. It is
# the capture path that survives a reset the local pstore console zone cannot,
# because it leaves the machine before the reset.
#
# Receive on the target with:
#   nc -u -l -p 6666 | tee netconsole-target.log
TARGET_HOST=CHANGE-ME-target-host
TARGET_PORT=6666
LOCAL_PORT=6665
