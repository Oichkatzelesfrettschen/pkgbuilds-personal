#  Local override of /usr/share/kdumpst.d/00-default, sourced after it by
#  kdumpst-load.sh.
#
#  This machine resets itself during graphical startup and records nothing,
#  so the goal is a dmesg capture that survives the reset, not a full vmcore.
#  Pstore-RAM does that from the 16 MiB region reserved by
#  "reserve_mem=16M:4096:ramoops" on the kernel command line, and needs no
#  crashkernel reservation. PSTORE_MEM_AMOUNT is deliberately absent:
#  00-default states that when reserve_mem is used kdumpst takes the largest
#  reserved region and never reads that variable.
#
#  PSTORE_RECORD_SZ is read, and reaches the module as ramoops record_size.
#  256 KiB against a 14 MiB dump area, after the 2 MiB console zone set in
#  /etc/modprobe.d/50-ramoops-console.conf, gives 56 dump zones instead of 14.
#
#  Kdump is disabled because it is the fallback kdumpst takes when pstore-RAM
#  cannot load, and it then fails on the absent crashkernel= reservation,
#  leaving the unit failed for a reason unrelated to the capture that is
#  actually wanted. Disabling it also stops the alpm hooks rebuilding a kdump
#  initramfs on every kernel update.
USE_PSTORE_RAM=1
PSTORE_RECORD_SZ=262144
DISABLE_KDUMP=1
