<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Prefer Spline Sans for proportional and Spline Sans Mono for fixed-pitch generic families</description>
  <!--
    Slot 52 loads after 50-user.conf and 51-local.conf, so a per-user or
    local.conf preference still ranks first, and before 60-latin.conf, whose
    DejaVu and Noto preferences rank behind these.
  -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Spline Sans</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>Spline Sans</family></prefer>
  </alias>
  <alias>
    <family>ui-sans-serif</family>
    <prefer><family>Spline Sans</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Spline Sans Mono</family></prefer>
  </alias>
  <alias>
    <family>ui-monospace</family>
    <prefer><family>Spline Sans Mono</family></prefer>
  </alias>
</fontconfig>
