#  distccd serves the build mesh on the LAN, so it starts after the network is
#  configured and after the daemon that advertises it.
#
#  The avahi half is ordering held in advance rather than a dependency in force:
#  advertising happens only when distccd runs with --zeroconf, and
#  /etc/conf.d/distccd currently passes "--allow <lan-cidr> --listen 0.0.0.0"
#  with clients reaching this host by an explicit host list. Add --zeroconf
#  there and this ordering is already correct; leave it off and the ordering
#  costs nothing, because avahi-daemon is enabled and reached long before
#  distccd.
[Unit]
Wants=network-online.target avahi-daemon.service
After=network-online.target avahi-daemon.service
