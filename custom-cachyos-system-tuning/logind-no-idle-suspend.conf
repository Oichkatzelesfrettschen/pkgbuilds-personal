#  Keys owned: IdleAction, IdleActionSec, HandleSuspendKey,
#  HandleSuspendKeyLongPress, HandleHibernateKey, HandleHibernateKeyLongPress.
#  No other logind.conf.d file sets them.
#  This workstation is reached while nobody is at the keyboard: distccd serves
#  the build mesh, sunshine.service and krfb.service serve remote sessions, and
#  four actions.runner units take CI jobs. An idle suspend drops all of them and
#  the machine stays unreachable until someone presses a key on it.
#
#  Paired with sleep-no-sleep.conf, which refuses the transition itself, so a
#  caller that asks logind directly is refused too.
[Login]
IdleAction=ignore
IdleActionSec=0
HandleSuspendKey=ignore
HandleSuspendKeyLongPress=ignore
HandleHibernateKey=ignore
HandleHibernateKeyLongPress=ignore
