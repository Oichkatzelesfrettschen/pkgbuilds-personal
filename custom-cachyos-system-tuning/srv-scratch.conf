# Path owned: /srv/scratch (one tmpfiles d line, 3-day age).
# /srv/scratch holds per-job output and analysis intermediates that a queue
# job or a device pull regenerates; images that must survive live in the
# device repositories. The daily clean pass removes an entry once its mtime,
# atime and birth time (and ctime, for files) are all older than 3 days.
# / mounts noatime, so reads do not extend an entry's life. A directory under
# a BSD file lock is skipped with everything below it.
d /srv/scratch 1777 root root 3d
