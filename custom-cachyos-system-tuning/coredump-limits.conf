#  Keys owned: [Coredump] Storage, Compress, ProcessSizeMax, ExternalSizeMax,
#  MaxUse, KeepFree. kernel.core_pattern stays with 50-coredump.conf (systemd).
#  systemd-coredump stores every dump under /var/lib/systemd/coredump with no
#  total cap of its own, so a crash loop in a process holding tens of gigabytes
#  fills the root filesystem. These bounds keep a dump useful for a backtrace
#  while holding the accumulation to a gigabyte.
[Coredump]
Storage=external
Compress=yes
#  Memory read out of the crashing process, before compression.
ProcessSizeMax=2G
#  The stored file, after compression.
ExternalSizeMax=2G
#  All stored dumps together.
MaxUse=1G
#  Storing stops rather than taking the filesystem below this.
KeepFree=1G
