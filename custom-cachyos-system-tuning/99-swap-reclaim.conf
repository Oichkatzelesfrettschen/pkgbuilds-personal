# /etc/sysctl.d/99-swap-reclaim.conf - anonymous-versus-file reclaim balance
#
# Keys owned: vm.swappiness, vm.page-cluster.
# Overlap resolved: 70-cachyos-settings.conf (cachyos-settings) sets
# swappiness 100 and page-cluster 0; 30-zram.rules (cachyos-settings) writes
# swappiness 150 only when a zram0 device initializes, which never happens
# while zram-generator.conf here declares no device. systemd-sysctl applies
# files in basename order across /etc, /run and /usr/lib, so 99- sorts last and
# this file is the single owner of both keys. The cachyos page-cluster comment
# recommends 1 for SSD swap; its 0 rests on zram, this file's 0 on zswap.
#
# swappiness 150: vm.rst defines swappiness as the relative I/O cost of
# swapping against filesystem paging (0 to 200) and states that zswap and
# swap on a device faster than the filesystem justify values above 100
# (x + 2x = 200 gives 133 for swap 2x cheaper). Here about 77% of swap-ins
# decompress from the zswap pool (zswpin against pswpin) and the rest read the
# TLC 980 PRO, while file reads come from the DRAM-less QLC root, so swap is
# at least 3x cheaper and 150 is the conservative end of that range.
#
# page-cluster 0: vm.rst, "Zero disables swap readahead completely". A zswap
# hit is a single-page decompress, and readahead of neighboring slots would
# decompress or read pages nobody faulted; swap_ra_hit stays in the low
# thousands per boot either way.
#
# Falsifier: workingset_refault_file per second above 3x
# workingset_refault_anon per second during builds while pswpin, not zswpin,
# carries most swap-ins (file cache is then the scarcer resource).

vm.swappiness = 150
vm.page-cluster = 0
