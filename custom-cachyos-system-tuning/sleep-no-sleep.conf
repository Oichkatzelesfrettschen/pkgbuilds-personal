#  Keys owned: AllowSuspend, AllowHibernation, AllowSuspendThenHibernate,
#  AllowHybridSleep. No other sleep.conf.d file sets them.
#  The second half of the policy in logind-no-idle-suspend.conf. logind's
#  Handle* settings govern only the events logind itself observes, so a
#  systemctl suspend, a desktop power applet, or an application asking through
#  the inhibitor interface still reaches the sleep transition. Refusing the
#  transitions here covers every caller.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
