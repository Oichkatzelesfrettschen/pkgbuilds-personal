# /usr/lib/systemd/system/ksmd.service.d/90-custom-cachyos-system-tuning.conf
#
# Key owned: ExecStart of ksmd.service (cachyos-ksm-settings). Overlap
# resolved: cachyos-ksm-settings enables KSM at two layers. ksmd.service
# (enabled, multi-user.target) runs "ksmctl -e", which writes 1 to
# /sys/kernel/mm/ksm/run, and 10-ksm.conf drop-ins set MemoryKSM=yes on
# user@.service, gdm.service and getty@.service. This drop-in replaces the
# start command with "ksmctl -d" (run=2: ksmd stops and unmerges), so the unit
# stays enabled and its state still names who owns KSM. The MemoryKSM=no
# drop-ins beside it cover the second layer. Owner decision 2026-11-24: "Turn
# KSM off".
#
# Measured 2026-11-24 after 10.2 days of uptime (878,078 s): ksmd used
# 4 h 17 min of CPU (15,423 s, 1.76% of one thread, 0.15% of the 12), and
# general_profit was 281,165,376 bytes (268 MiB, 0.4% of 62.7 GiB). Beside it:
# pages_sharing 90,951 (355 MiB), pages_volatile 1,271,336 (4.8 GiB rescanned
# without merging), cow_ksm 32,011,652 copy-on-write breaks of merged pages and
# ksm_swpin_copy 1,936,167 (/proc/vmstat).
#
# Applies at the next boot; restarting ksmd.service applies it at once and
# unmerges about 355 MiB. Falsifier: /sys/kernel/mm/ksm/run reading 1 after a
# boot, or MemAvailable lower by more than the 268 MiB profit at a comparable
# load.
[Service]
ExecStart=
ExecStart=/usr/bin/ksmctl -d
