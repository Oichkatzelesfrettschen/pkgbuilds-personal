# /etc/sysctl.d/99-free-memory-reserve.conf - free-page reserve and compaction
#
# Keys owned: vm.min_free_kbytes, vm.watermark_scale_factor,
# vm.watermark_boost_factor, vm.compaction_proactiveness.
# Overlap resolved: no sysctl.d file sets these keys. Two kernel defaults
# differ on this host: upstream page_alloc.c (v7.3) initializes
# watermark_boost_factor to 15000, the CachyOS kernel patch series (cachy.patch
# in CachyOS/kernel-patches, read for 6.6 to 6.9) initializes it to 0, and 0
# reads live on linux-cachyos 7.3; compaction_proactiveness is 20 upstream. This file pins both live values so a fallback kernel without the
# CachyOS patch keeps the same allocator behavior.
#
# min_free_kbytes 262144: the kernel default is int_sqrt(lowmem_kbytes * 16),
# about 32 MiB at 62.7 GiB, clamped to 262144. 256 MiB keeps room for
# atomic and higher-order allocations on the display path; vm.rst notes that
# once written, the kernel no longer adjusts the value.
# watermark_scale_factor 50: watermarks 0.5% of RAM apart (about 320 MiB at
# 62.7 GiB) instead of 0.1%, so kswapd starts earlier and direct reclaim later.
# watermark_boost_factor 0: a boost reclaims up to 150% of the high watermark
# after each fragmentation event (vm.rst); with the 0.5% spacing above, a
# boost would drop page cache in bursts while the scale factor already gives
# kswapd its headroom.
# compaction_proactiveness 20: the upstream default, pinned.
#
# Falsifier: a "page allocation failure: order:3" or higher line in the kernel
# log, or compact_stall growing faster than thp_fault_alloc while compact_fail
# stays above 85% of compact_stall; either sends watermark_boost_factor to an
# A/B against 15000 (SYSTEM.md, measurement plans).

vm.min_free_kbytes = 262144
vm.watermark_scale_factor = 50
vm.watermark_boost_factor = 0
vm.compaction_proactiveness = 20
