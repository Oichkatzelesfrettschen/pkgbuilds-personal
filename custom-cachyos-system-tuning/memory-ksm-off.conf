# Installed as 90-custom-cachyos-system-tuning.conf under user@.service.d,
# gdm.service.d and getty@.service.d.
#
# Key owned: MemoryKSM. Overlap resolved: cachyos-ksm-settings sets
# MemoryKSM=yes in 10-ksm.conf in the same directories; this file sorts after
# it, so MemoryKSM=no wins. With /sys/kernel/mm/ksm/run at 2 (ksmd-off.conf)
# ksmd scans nothing, so MemoryKSM=yes alone would merge nothing; MemoryKSM=no
# also stops the prctl(PR_SET_MEMORY_MERGE) that registers every session
# process with KSM. The other units cachyos-ksm-settings covers (sddm,
# lightdm, ly, plasmalogin, kmsconvt@) are not installed here. Applies when the
# unit next starts. Falsifier: systemctl show user@1000.service -p MemoryKSM
# reading yes after a boot.
[Service]
MemoryKSM=no
