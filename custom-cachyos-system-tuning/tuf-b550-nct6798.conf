# TUF GAMING B550-PLUS WIFI II - NCT6798D Sensor Configuration
# ============================================================
# WHY: The NCT6798D Super I/O chip has many unused/floating inputs that
#      generate false alarms and confusing readings. This config:
#      - Labels sensors with their actual function
#      - Ignores disconnected/floating inputs
#      - Sets appropriate thresholds for real sensors
#
# WHAT: Motherboard sensor chip configuration for lm_sensors
# HOW:  Place in /etc/sensors.d/ and run 'sensors -s' to apply
#
# Board: ASUS TUF GAMING B550-PLUS WIFI II
# Chip:  Nuvoton NCT6798D Super I/O
# Date:  2025-12-25
# ============================================================

chip "nct6798-*"

    # ========== VOLTAGES ==========
    # in0 = Vcore (CPU core voltage)
    label in0 "Vcore"

    # Unused/unconfigured voltage inputs - ignore to avoid false alarms
    ignore in1
    ignore in2
    ignore in3
    ignore in4
    ignore in5
    ignore in6
    ignore in7
    ignore in8
    ignore in9
    ignore in10
    ignore in11
    ignore in12
    ignore in13
    ignore in14

    # ========== FANS ==========
    # Label connected fans, ignore unused headers
    label fan1 "Chassis Fan 1"
    label fan2 "CPU Fan"
    ignore fan3
    label fan4 "Chassis Fan 2"
    ignore fan5
    ignore fan6
    label fan7 "AIO Pump"

    # ========== TEMPERATURES ==========
    # temp1 = SYSTIN: Motherboard ambient temperature (31C typical)
    label temp1 "Motherboard"

    # temp2 = CPUTIN: CPU socket thermistor
    # Note: Often unreliable on ASUS boards, prefer k10temp/Tctl
    label temp2 "CPU Socket"

    # temp3 = AUXTIN0: Shows ~84C - possibly VRM or floating
    # Investigation needed; raised thresholds to suppress false alarm
    label temp3 "AUXTIN0 (VRM?)"

    # temp4 = AUXTIN1: Shows ~52C - might be real sensor
    label temp4 "AUXTIN1"

    # temp5 = AUXTIN2: FLOATING (-62C reading = disconnected NTC)
    ignore temp5

    # temp6 = AUXTIN3: Shows ~78C - suspicious, likely floating
    ignore temp6

    # temp7 = AUXTIN4: Shows ~31C (ambient range) - might be T_SENSOR header
    label temp7 "T_SENSOR Header"

    # temp8 = PECI Agent 0 Calibration: Digital CPU temp via PECI interface
    label temp8 "CPU PECI"

    # temp9-12 = PCH sensors: Intel-specific, always 0C on AMD systems
    ignore temp9
    ignore temp10
    ignore temp11
    ignore temp12

    # temp13 = TSI0_TEMP: AMD SB-TSI interface (Tctl equivalent)
    label temp13 "CPU TSI"

    # ========== INTRUSION ==========
    # Case intrusion pins typically floating on consumer boards
    ignore intrusion0
    ignore intrusion1

    # ========== BEEP ==========
    ignore beep_enable

# ============================================================
# DDR4 SPD Temperature Sensors (jc42 driver)
# These are on-DIMM temperature sensors via SMBus
# DDR4 spec: Max operating 85C, critical 95C
# Note: Thresholds must be set via sysfs with root
# ============================================================
chip "jc42-*"
    label temp1 "DDR4 DIMM"

# ============================================================
# AMD k10temp - Primary CPU temperature sensor
# This is the most accurate CPU temperature on AMD systems
# ============================================================
chip "k10temp-*"
    label temp1 "CPU Tctl"
    # Tctl includes a Tdie offset for fan curve targeting

# ============================================================
# NVMe Temperature Sensors
# ============================================================
chip "nvme-*"
    label temp1 "NVMe Controller"
    label temp2 "NVMe Sensor 1"
    label temp3 "NVMe Sensor 2"

# ========== DDR4 DIMM thermal sensors (JEDEC TSE2004 on the SPD hub) ==========
# The two jc42 sensors on SMBus PIIX4 port 0 (addresses 0x18 and 0x19) power up
# with every limit register at 0 degC, so libsensors reports ALARM (HIGH, CRIT)
# at any real temperature. JEDEC DDR4 parts are rated to 85 degC case
# temperature; 75 degC gives a warning band below that rating. The registers
# are writable and unlocked on these Corsair/Micron modules, and lm_sensors.service
# applies these values at boot through 'sensors -s'.
chip "jc42-*"
    label temp1 "DDR4 DIMM"
    set temp1_max  75
    set temp1_crit 85
