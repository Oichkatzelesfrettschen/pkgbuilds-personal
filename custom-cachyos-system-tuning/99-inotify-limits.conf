# Keys owned: fs.inotify.max_user_instances, fs.inotify.max_user_watches.
# Overlap resolved: 10-arch.conf (filesystem) sets 1024 and 524288; this file
# sorts later in systemd-sysctl order and its values win.
# inotify ceilings for this workstation, one file instead of three.
# Arch 10-arch.conf sets 1024 instances and 524288 watches. Two writers raised
# them outside any package: the KDE inotify survey (1152 instances, 647168
# watches) and the LLM lab runbook (1024 instances for native coding-client
# watchers, which hang on EMFILE). Git fsmonitor daemons in many worktrees hold
# one instance each. This file sorts after both and keeps the larger value of
# each limit.
fs.inotify.max_user_instances = 1152
fs.inotify.max_user_watches = 647168
