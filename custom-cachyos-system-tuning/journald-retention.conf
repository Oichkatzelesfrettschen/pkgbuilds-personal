#  /usr/lib/systemd/journald.conf.d/50-custom-cachyos-system-tuning.conf
#
#  Keys owned: SystemMaxUse, SystemMaxFileSize, MaxRetentionSec. Overlap
#  resolved: 00-journal-size.conf (cachyos-settings) sets SystemMaxUse=50M and
#  sorts first, so these values win. The 50M baseline held about two boots,
#  and a boot regression surfaces several boots after it appears.
#
#  Measured 2026-11-24: 1020M of journal spanned 2026-11-21 06:19 to the
#  present, about 280 MB a day. Over the last 3 days warp-svc.service wrote
#  181,367 lines and 336 MB of message text, 71% of all message bytes (472 MB).
#  The owner decision of 2026-11-24 raises the cap to 1.5 GiB and quiets the
#  noisy units: per-unit LogRateLimit drop-ins for warp-svc.service and
#  vmware-usbarbitrator.service ship beside this file (SYSTEM.md, journald).
#  Predicted: at most about 60 MB a day of journal after the drop-ins apply,
#  so 1536M spans weeks and MaxRetentionSec=1month becomes the binding limit.
#  Falsifier: journalctl --disk-usage at 1536M with the oldest entry under
#  14 days old.
[Journal]
SystemMaxUse=1536M
SystemMaxFileSize=128M
MaxRetentionSec=1month
