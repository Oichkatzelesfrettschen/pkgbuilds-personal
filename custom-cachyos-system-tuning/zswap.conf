# /usr/lib/tmpfiles.d/custom-cachyos-system-tuning-zswap.conf
#
# Keys owned: /sys/module/zswap/parameters/{compressor, max_pool_percent,
# shrinker_enabled, enabled}. accept_threshold_percent stays at the kernel
# default of 90 (mm/zswap.c): after the pool fills, zswap accepts pages again
# once it shrinks below 90% of the cap, which damps store/reject flapping.
#
# Overlap trace, applied in this order at boot:
#   1. Kconfig of linux-cachyos 7.3: CONFIG_ZSWAP_DEFAULT_ON=y,
#      CONFIG_ZSWAP_COMPRESSOR_DEFAULT="zstd", CONFIG_ZSWAP_SHRINKER_DEFAULT_ON=y,
#      max_pool_percent 20 (mm/zswap.c).
#   2. Kernel command line: zswap.* is absent from /etc/kernel/cmdline.
#   3. 30-zram.rules (cachyos-settings) writes enabled=N when zram0
#      initializes; zram-generator.conf in this package declares no device, so
#      the rule never fires.
#   4. These "w!" lines (systemd-tmpfiles --boot only). The pacman hook runs
#      tmpfiles without --boot and skips them, so an install changes nothing
#      live and the values land at the next boot.
# Lines 1 and 4 agree on enabled, compressor and shrinker; they are stated so a
# kernel with other Kconfig defaults cannot change the tier silently. The one
# value delta is max_pool_percent 25 against 20.
#
# zswap is the compressed tier in front of the 980 PRO swapfile (priority 50)
# and the root-disk /swapfile (priority 10). Each pooled page holds a slot on
# one of those devices, so swap "used" (SwapUsedLimit in oomd, memory.swap.max
# on a cgroup) counts pages whose data sits compressed in RAM.
#
# max_pool_percent 25: 15.7 GiB at 62.7 GiB of RAM. At the measured 4.2:1 to
# 4.8:1 zstd ratio that holds 66 to 75 GiB of anonymous pages, more than the
# 64 GiB of swap slots, so swap capacity, not the pool, bounds the tier.
# shrinker_enabled Y: the shrinker is memcg-aware. It writes entries back to
# disk under reclaim, including the reclaim a cgroup's own memory.high or
# memory.max triggers, and it exempts as many entries as that cgroup recently
# faulted back from disk (nr_disk_swapins). On 2026-11-24, 62% of zswpwb since
# boot came from bounded.slice, the build slice under its memory.high.
# enabled Y: written last, after the parameters it depends on.
#
# Falsifier: Zswap in /proc/meminfo reaching 25% of MemTotal (the cap binds),
# or, in a build window, pswpin above half of zswpwb while memory PSI full
# stays under 1% (writeback evicts pages that come straight back).
w! /sys/module/zswap/parameters/compressor       - - - - zstd
w! /sys/module/zswap/parameters/max_pool_percent - - - - 25
w! /sys/module/zswap/parameters/shrinker_enabled - - - - Y
w! /sys/module/zswap/parameters/enabled          - - - - Y
