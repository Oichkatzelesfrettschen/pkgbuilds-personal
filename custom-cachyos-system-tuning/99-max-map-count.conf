# /etc/sysctl.d/99-max-map-count.conf - mmap region ceiling (workstation)
#
# Key owned: vm.max_map_count. Overlap resolved: 10-arch.conf (filesystem,
# 1048576) and 60-elasticsearch.conf (elasticsearch, 262144).
#
# systemd-sysctl applies every sysctl.d file in basename order across /etc,
# /run and /usr/lib, so the last file to set a key wins. Arch's
# 10-arch.conf sets vm.max_map_count = 1048576 for games and large mmap
# workloads; elasticsearch's 60-elasticsearch.conf, installed as a
# dependency of python-flow.record, sets 262144 and sorts later. This file
# sorts after both and restores 1048576, which also exceeds the 262144
# minimum elasticsearch requires.

vm.max_map_count = 1048576
