# /usr/lib/systemd/system/warp-svc.service.d/50-custom-cachyos-system-tuning.conf
#
# Keys owned: LogRateLimitIntervalSec, LogRateLimitBurst for warp-svc.service
# (unit file owned by cloudflare-warp-bin). No other drop-in sets them.
#
# Measured 2026-11-21 to 2026-11-24: 181,367 lines (63k to 74k a day, about
# 0.8 a second, steady) and 336 MB of message text, every line at PRIORITY 6
# because the daemon writes its own levels (INFO, DEBUG) to stdout as text.
# LogLevelMax cannot separate them: notice would drop every line, info drops
# none. A rate limit keeps the first lines of every window, including a
# start-up failure, and journald records how many lines it suppressed, so the
# noise stays measurable.
#
# 10 lines per 10 minutes. journald multiplies the burst by a factor of 1 to 6
# derived from free journal space (journald.conf(5), RateLimitBurst=), so the
# ceiling is 1,440 to 8,640 lines a day against the measured 63k to 74k.
# Takes effect when the service next starts (journald reads the values PID 1
# exports under /run/systemd/units at start).
# Falsifier: more than 8,640 warp-svc lines in a day, or no "Suppressed"
# message from journald for warp-svc.service in a day.
[Service]
LogRateLimitIntervalSec=10min
LogRateLimitBurst=10
