# /usr/lib/systemd/system/-.slice.d/10-managed-oom-swap.conf
#
# Key owned: ManagedOOMSwap on -.slice.
# Overlap: cachyos-settings sets ManagedOOMSwap=kill (and a memory-pressure
# kill at 80%) on system.slice in system.slice.d/10-oomd-per-slice-defaults.conf.
# The two nest: oomd monitors each unit that sets kill and chooses victims among
# its descendants, so this root entry covers user.slice and bounded.slice,
# which the cachyos entry leaves out, and system.slice stays monitored twice to
# the same effect.
#
# systemd-oomd monitors swap only for a subtree whose slice sets
# ManagedOOMSwap=kill; the default "auto" leaves every cgroup unmonitored. This
# drop-in on -.slice makes each descendant cgroup eligible for the swap
# backstop in oomd.conf.d/95-custom-cachyos-system-tuning.conf (90% of memory
# and 90% of swap used, victim above 5% of total swap). Terminal tab scopes stay
# under that 5% through MemorySwapMax=2G (the terminal tab-scope OOM drop-in, a separate private package).

[Slice]
ManagedOOMSwap=kill
