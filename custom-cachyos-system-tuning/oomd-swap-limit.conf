# /usr/lib/systemd/oomd.conf.d/95-custom-cachyos-system-tuning.conf
#
# Key owned: [OOM] SwapUsedLimit. DefaultMemoryPressureLimit and
# DefaultMemoryPressureDurationSec stay at the systemd defaults (60%, 30 s);
# no other oomd.conf.d file sets SwapUsedLimit.
#
# The swap guard is a last-resort backstop at the upstream default of 90%.
# systemd-oomd acts on SwapUsedLimit only when both memory used and swap used
# exceed it, and then kills only an eligible descendant cgroup holding more
# than 5% of total swap (THRESHOLD_SWAP_USED_PERCENT in src/oom/oomd-manager.h).
# A workload with ManagedOOMPreference=omit is never eligible, so a low limit
# with an omitted build fires continuously and kills nothing, and a limit that is
# a fraction of total swap moves every time a swap tier is added or resized.
#
# Pressure on the swap devices is bounded instead by per-workload budgets:
# bounded-workload.slice (user) and bounded-build.slice (system) carry
# MemoryHigh and MemorySwapMax, and a build unit in bounded-build.slice runs
# with ManagedOOMPreference=avoid so it is the last candidate rather than an
# exempt one.

[OOM]
SwapUsedLimit=90%
