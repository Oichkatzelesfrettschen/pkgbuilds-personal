# /etc/sysctl.d/99-vfs-cache-pressure.conf - dentry and inode slab reclaim
#
# Key owned: vm.vfs_cache_pressure.
# Overlap resolved: 70-cachyos-settings.conf (cachyos-settings) sets 50. This
# file sorts later and restores the upstream value of 100, at which dentry and
# inode reclaim tracks page-cache reclaim (vm.rst).
#
# Full-tree source and evidence scans create millions of dentries and inodes.
# Under 50 the scans retained 14 GiB of reclaimable slab and fragmented the
# Normal zone until a 32 KiB NVIDIA DRM allocation invoked global OOM.
#
# Falsifier: KReclaimable in /proc/meminfo above a quarter of MemTotal during a
# scan, or dentry-heavy workloads (git status over many worktrees) showing a
# measured regression against 50 with slab held below that bound.

vm.vfs_cache_pressure = 100
