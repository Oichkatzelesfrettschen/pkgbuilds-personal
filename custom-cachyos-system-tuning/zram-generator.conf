# /etc/systemd/zram-generator.conf - zram disabled; zswap is the compressed tier
#
# Key owned: the zram device set. Overlap resolved: shadows
# /usr/lib/systemd/zram-generator.conf (cachyos-settings, [zram0] = ram).
#
# This file declares no [zramN] section. zram-generator reads the first main
# configuration file it finds, /etc before /usr/lib, so this file shadows the
# cachyos-settings /usr/lib/systemd/zram-generator.conf ([zram0] zram-size=ram)
# and the generator creates no device ("No devices configured, exiting").
#
# zram at a higher swap priority than disk swap keeps whatever page reached it
# first: zram accepts pages until its disksize is full, then every later page,
# hot or cold, goes to disk. zswap instead caches compressed pages in front of
# the disk swapfile and its shrinker writes the coldest entries back, so the
# pages that stay in RAM are the ones most recently used. zswap is enabled at
# boot by /usr/lib/tmpfiles.d/custom-cachyos-system-tuning-zswap.conf.
#
# Restoring zram means adding a [zram0] section here and removing that tmpfiles
# file; zram and zswap together put a compressed cache in front of a
# compressed device.
