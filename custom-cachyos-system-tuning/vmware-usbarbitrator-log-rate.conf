# /usr/lib/systemd/system/vmware-usbarbitrator.service.d/50-custom-cachyos-system-tuning.conf
#
# Keys owned: LogRateLimitIntervalSec, LogRateLimitBurst for
# vmware-usbarbitrator.service (unit file owned by vmware-workstation).
#
# Measured 2026-11-21 to 2026-11-24: 34,734 lines (about 11,600 a day), the
# second-largest system unit after warp-svc, all at PRIORITY 6: USB device
# enumeration and autoconnect status ("USBArb: 8 devices enumerated").
#
# 10 lines per hour; with journald's free-space burst factor of 1 to 6 the
# ceiling is 240 to 1,440 lines a day. Takes effect when the service next
# starts. Falsifier: more than 1,440 lines in a day, or a USB passthrough
# failure whose arbitrator lines fell in a suppressed window.
[Service]
LogRateLimitIntervalSec=1h
LogRateLimitBurst=10
