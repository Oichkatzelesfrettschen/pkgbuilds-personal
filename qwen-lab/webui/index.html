<!doctype html>
<meta charset="utf-8">
<title>qwen-lab</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  A front end that costs the card nothing.

  llama-server serves this itself from --path, so there is no second process and
  no GPU context beyond the browser already running. That matters here more than
  it usually would: on this machine 204 MiB of VRAM is the difference between
  24.43 and 39.22 tok/s, and a dedicated Electron client measured 103 MiB, which
  is the most expensive way to obtain a chat box.

  llama-server also embeds the upstream SvelteKit UI, and this build has it, so
  prefer that for ordinary use. This page is a diagnostic panel: what it adds is
  instrumentation, not features.

  Three of its behaviours come straight from measurements in evidence/:

  Reasoning is shown, folded, beside the answer. This model routinely spends a
  whole small token budget reasoning and returns an empty content, which reads
  downstream as a dead server; two runs in this lab were misread that way before
  the cause was found.

  A file is counted before it is sent. There is no file API: a front end reads
  the bytes and puts them in the prompt, and the server refuses an overflow with
  HTTP 400 rather than truncating. Log-shaped text runs about 2.6 characters to
  the token, not the 3.6 a prose estimate assumes, so a 700-line log that looks
  like it fits tokenised to 18837 against a 16384 context.

  The rate is reported per request, separating prefill from decode, because the
  floor this lab was built around is a decode floor and a long prompt moves
  time into prefill without moving the rate.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfaf8; --fg: #1a1a19; --dim: #6b6a66; --line: #e2e0da;
    --mine: #eceae4; --warn: #8a5a00; --bad: #a03020;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16161a; --fg:#e6e5e2; --dim:#9a9892; --line:#2c2c32;
            --mine:#23232a; --warn:#d0a040; --bad:#e08070; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 system-ui,sans-serif;
         display:flex; flex-direction:column; height:100dvh; }
  header { padding:.6rem 1rem; border-bottom:1px solid var(--line); display:flex;
           gap:1rem; align-items:center; flex-wrap:wrap; }
  header b { font-weight:600; }
  header span { color:var(--dim); font-size:13px; }
  #log { flex:1; overflow-y:auto; padding:1rem; display:flex; flex-direction:column; gap:1rem; }
  .turn { max-width:min(52rem,100%); }
  .turn.me { align-self:flex-end; background:var(--mine); padding:.5rem .8rem; border-radius:.6rem; }
  .who { font-size:12px; color:var(--dim); margin-bottom:.2rem; }
  .body { white-space:pre-wrap; overflow-wrap:anywhere; }
  details.think { margin:.3rem 0 .5rem; border-left:2px solid var(--line); padding-left:.6rem; }
  details.think summary { cursor:pointer; color:var(--dim); font-size:13px; }
  details.think .body { color:var(--dim); font-size:13px; }
  pre.tool { background:var(--mine); padding:.5rem .7rem; border-radius:.4rem;
             overflow-x:auto; font-size:13px; margin:.4rem 0; }
  .meta { font-size:12px; color:var(--dim); margin-top:.3rem; }
  .meta.bad { color:var(--bad); }
  footer { border-top:1px solid var(--line); padding:.6rem 1rem; display:flex;
           flex-direction:column; gap:.5rem; }
  #attached { display:flex; gap:.5rem; flex-wrap:wrap; }
  .chip { font-size:12px; background:var(--mine); border-radius:.4rem; padding:.2rem .5rem;
          display:flex; gap:.4rem; align-items:center; }
  .chip.over { color:var(--bad); }
  .chip button { border:0; background:none; color:inherit; cursor:pointer; font-size:14px; padding:0; }
  .row { display:flex; gap:.5rem; align-items:flex-end; }
  textarea { flex:1; resize:none; font:inherit; padding:.5rem .7rem; border-radius:.5rem;
             border:1px solid var(--line); background:var(--bg); color:var(--fg); min-height:2.6rem; }
  button.act { font:inherit; padding:.5rem .9rem; border-radius:.5rem; border:1px solid var(--line);
               background:var(--mine); color:var(--fg); cursor:pointer; }
  button.act:disabled { opacity:.5; cursor:default; }
  label.file { cursor:pointer; }
  input[type=file] { display:none; }
</style>

<header>
  <b>qwen-lab</b>
  <span id="model">connecting</span>
  <span id="ctx"></span>
  <span style="flex:1"></span>
  <label class="chip"><input type="checkbox" id="tools"> offer a demo tool</label>
  <button class="act" id="clear">clear</button>
</header>

<div id="log"></div>

<footer>
  <div id="attached"></div>
  <div class="row">
    <label class="file chip">attach
      <input type="file" id="file" multiple accept="image/*,text/*,.md,.txt,.log,.csv,.json,.py,.c,.h,.rs,.sh">
    </label>
    <textarea id="input" rows="1" placeholder="Ask. Shift+Enter for a newline."></textarea>
    <button class="act" id="send">send</button>
  </div>
</footer>

<script>
const $ = s => document.querySelector(s);
const logEl = $('#log');
let history = [];
let attachments = [];   // {kind:'image'|'text', name, dataUri|text, tokens}
let nctx = null;
let busy = false;

// Log-shaped text runs about 2.6 characters to the token. Prose runs longer, so
// the conservative divisor is the right one for a warning that exists to stop a
// 400 the server would otherwise return after the whole file is uploaded.
const CHARS_PER_TOKEN = 2.6;
const estTokens = s => Math.ceil(s.length / CHARS_PER_TOKEN);

const DEMO_TOOL = [{
  type: "function",
  function: {
    name: "get_weather",
    description: "Current weather for a named city.",
    parameters: {
      type: "object",
      properties: {
        city: { type: "string", description: "City name" },
        unit: { type: "string", enum: ["celsius", "fahrenheit"] }
      },
      required: ["city"]
    }
  }
}];

async function boot() {
  // /props answers 200 with {"message":"Loading model"} for the two minutes a
  // 9 GiB checkpoint takes to reach the card, so a single read taken during the
  // load succeeds, yields no n_ctx, and leaves the attachment warning disabled
  // for the rest of the session. Poll until the context appears.
  for (let attempt = 0; ; attempt++) {
    try {
      const p = await (await fetch('./props')).json();
      nctx = p.default_generation_settings?.n_ctx ?? p.n_ctx ?? null;
      if (nctx) {
        $('#model').textContent = (p.model_path || '').split('/').pop() || 'model';
        $('#ctx').textContent = nctx.toLocaleString() + ' token context';
        renderAttached();
        return;
      }
      $('#model').textContent = p.message || 'loading';
    } catch {
      $('#model').textContent = 'no /props; is llama-server running?';
    }
    if (attempt > 240) { $('#model').textContent = 'gave up waiting for /props'; return; }
    await new Promise(r => setTimeout(r, 2000));
  }
}
boot();

function chip(text, over, onRemove) {
  const c = document.createElement('span');
  c.className = 'chip' + (over ? ' over' : '');
  c.append(text);
  const b = document.createElement('button');
  b.textContent = '×';
  b.onclick = onRemove;
  c.append(b);
  return c;
}

function renderAttached() {
  const box = $('#attached');
  box.textContent = '';
  let total = 0;
  attachments.forEach(a => total += a.tokens);
  attachments.forEach((a, i) => {
    const over = nctx && total > nctx * 0.9;
    box.append(chip(
      `${a.name} — ${a.kind === 'image' ? 'image' : estTokens(a.text).toLocaleString() + ' tokens'}`,
      over, () => { attachments.splice(i, 1); renderAttached(); }));
  });
  if (attachments.length && nctx && total > nctx * 0.9) {
    const w = document.createElement('span');
    w.className = 'chip over';
    w.textContent = `about ${total.toLocaleString()} tokens against a ${nctx.toLocaleString()} context; the server will refuse this with a 400`;
    box.append(w);
  }
}

$('#file').onchange = async e => {
  for (const f of e.target.files) {
    if (f.type.startsWith('image/')) {
      const dataUri = await new Promise(res => {
        const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f);
      });
      // An image is not free in the cache either: the projector emits tokens
      // into the same KV the text uses, at least 1024 of them for grounding.
      attachments.push({ kind: 'image', name: f.name, dataUri, tokens: 1024 });
    } else {
      const text = await f.text();
      attachments.push({ kind: 'text', name: f.name, text, tokens: estTokens(text) });
    }
  }
  e.target.value = '';
  renderAttached();
};

function turn(who, cls) {
  const d = document.createElement('div');
  d.className = 'turn' + (cls ? ' ' + cls : '');
  const w = document.createElement('div');
  w.className = 'who'; w.textContent = who;
  const b = document.createElement('div');
  b.className = 'body';
  d.append(w, b);
  logEl.append(d);
  logEl.scrollTop = logEl.scrollHeight;
  return { root: d, body: b };
}

$('#clear').onclick = () => { history = []; logEl.textContent = ''; };

$('#input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('#send').onclick = send;

async function send() {
  if (busy) return;
  const text = $('#input').value.trim();
  if (!text && !attachments.length) return;

  const parts = [];
  const textFiles = attachments.filter(a => a.kind === 'text');
  const images = attachments.filter(a => a.kind === 'image');
  let prompt = text;
  for (const f of textFiles) {
    prompt = `--- ${f.name} ---\n${f.text}\n--- end ${f.name} ---\n\n` + prompt;
  }
  if (images.length) {
    parts.push({ type: 'text', text: prompt });
    for (const im of images) parts.push({ type: 'image_url', image_url: { url: im.dataUri } });
  }
  const content = images.length ? parts : prompt;

  const shown = text + (attachments.length
    ? '\n' + attachments.map(a => `[${a.name}]`).join(' ') : '');
  turn('you', 'me').body.textContent = shown;
  history.push({ role: 'user', content });
  $('#input').value = '';
  attachments = [];
  renderAttached();

  busy = true; $('#send').disabled = true;
  const t = turn('qwen');
  const think = document.createElement('details');
  think.className = 'think';
  const sum = document.createElement('summary');
  sum.textContent = 'reasoning';
  const tb = document.createElement('div');
  tb.className = 'body';
  think.append(sum, tb);
  let thinkShown = false;
  const meta = document.createElement('div');
  meta.className = 'meta';
  t.root.append(meta);

  const body = { model: 'qwen38', stream: true, temperature: 0.7,
                 max_tokens: 2048, messages: history };
  if ($('#tools').checked) body.tools = DEMO_TOOL;

  const t0 = performance.now();
  let first = null, n = 0, answer = '', reasoning = '', finish = null;
  const toolCalls = {};
  try {
    const resp = await fetch('./v1/chat/completions', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!resp.ok) {
      const detail = await resp.text();
      throw new Error(`HTTP ${resp.status}. ${detail.slice(0, 300)}`);
    }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        if (line === 'data: [DONE]') continue;
        let d; try { d = JSON.parse(line.slice(6)); } catch { continue; }
        const ch = d.choices?.[0]; if (!ch) continue;
        if (ch.finish_reason) finish = ch.finish_reason;
        const delta = ch.delta || {};
        for (const tc of delta.tool_calls || []) {
          const k = tc.index ?? 0;
          toolCalls[k] ||= { name: '', args: '' };
          if (tc.function?.name) toolCalls[k].name += tc.function.name;
          if (tc.function?.arguments) toolCalls[k].args += tc.function.arguments;
        }
        if (delta.reasoning_content) {
          if (first === null) first = performance.now();
          n++; reasoning += delta.reasoning_content; tb.textContent = reasoning;
          if (!thinkShown) { t.root.insertBefore(think, t.body); thinkShown = true; }
        }
        if (delta.content) {
          if (first === null) first = performance.now();
          n++; answer += delta.content; t.body.textContent = answer;
        }
        logEl.scrollTop = logEl.scrollHeight;
      }
    }
  } catch (err) {
    meta.className = 'meta bad';
    meta.textContent = String(err.message || err);
    busy = false; $('#send').disabled = false;
    return;
  }

  const calls = Object.values(toolCalls);
  if (calls.length) {
    const pre = document.createElement('pre');
    pre.className = 'tool';
    pre.textContent = calls.map(c => `${c.name}(${c.args})`).join('\n');
    t.root.insertBefore(pre, meta);
  }

  const total = (performance.now() - t0) / 1000;
  const ttft = first ? (first - t0) / 1000 : null;
  const rate = first && n > 1 ? n / ((performance.now() - first) / 1000) : null;
  const bits = [];
  if (ttft !== null) bits.push(`prefill ${ttft.toFixed(2)}s`);
  if (rate !== null) bits.push(`${rate.toFixed(1)} tok/s decode`);
  bits.push(`${n} tokens in ${total.toFixed(1)}s`);
  // A non-stop finish is a budget or a tool hand-off, not a wrong answer, and
  // saying so is the difference between reading a truncation as a model failure
  // and reading it as a harness limit.
  if (finish && finish !== 'stop') bits.push(`ended on ${finish}`);
  if (!answer && reasoning) bits.push('the answer is empty; the model spent the budget reasoning');
  meta.textContent = bits.join('  ·  ');

  const msg = { role: 'assistant', content: answer };
  if (calls.length) {
    msg.tool_calls = calls.map((c, i) => ({
      id: `call_${i}`, type: 'function',
      function: { name: c.name, arguments: c.args }
    }));
  }
  history.push(msg);
  busy = false; $('#send').disabled = false;
  $('#input').focus();
}
</script>
