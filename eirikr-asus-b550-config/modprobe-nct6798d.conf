# NCT6798D Hardware Monitor Configuration
# ASUS B550 super I/O chip
# Kernel module: nct6775 (supports NCT6798D chips)

# Enable all sensor monitoring
# pwm_mode: Controls whether fans use PWM (0) or DC (1) voltage control
# force_id: Required for proper NCT6798D detection on some boards
options nct6775 pwm_mode=0 force_id=0xd42a

# Disable power saving features if they cause issues
# options nct6775 disable_power_saving=1
